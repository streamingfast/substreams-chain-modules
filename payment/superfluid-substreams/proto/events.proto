syntax = "proto3";

package superfluid.v1;

import "sf/substreams/sink/sql/schema/v1/schema.proto";

// Superfluid protocol events (Base mainnet) for ClickHouse from-proto.

message Events {
  repeated FlowUpdatedEvent flow_updated_events = 1;
  repeated FlowUpdatedExtensionEvent flow_updated_extension_events = 2;
  repeated FlowOperatorUpdatedEvent flow_operator_updated_events = 3;
  repeated IndexCreatedEvent index_created_events = 4;
  repeated IndexDistributionClaimedEvent index_distribution_claimed_events = 5;
  repeated IndexUpdatedEvent index_updated_events = 6;
  repeated IndexSubscribedEvent index_subscribed_events = 7;
  repeated IndexUnitsUpdatedEvent index_units_updated_events = 8;
  repeated IndexUnsubscribedEvent index_unsubscribed_events = 9;
  repeated SubscriptionApprovedEvent subscription_approved_events = 10;
  repeated SubscriptionDistributionClaimedEvent subscription_distribution_claimed_events = 11;
  repeated SubscriptionRevokedEvent subscription_revoked_events = 12;
  repeated SubscriptionUnitsUpdatedEvent subscription_units_updated_events = 13;
  repeated BufferAdjustedEvent buffer_adjusted_events = 14;
  repeated FlowDistributionUpdatedEvent flow_distribution_updated_events = 15;
  repeated InstantDistributionUpdatedEvent instant_distribution_updated_events = 16;
  repeated PoolConnectionUpdatedEvent pool_connection_updated_events = 17;
  repeated PoolCreatedEvent pool_created_events = 18;
  repeated SuperTokenCreatedEvent super_token_created_events = 19;
  repeated CustomSuperTokenCreatedEvent custom_super_token_created_events = 20;
  repeated SuperTokenLogicCreatedEvent super_token_logic_created_events = 21;
  repeated AgreementLiquidatedByEvent agreement_liquidated_by_events = 22;
  repeated AgreementLiquidatedV2Event agreement_liquidated_v2_events = 23;
  repeated BurnedEvent burned_events = 24;
  repeated MintedEvent minted_events = 25;
  repeated SentEvent sent_events = 26;
  repeated TokenUpgradedEvent token_upgraded_events = 27;
  repeated TokenDowngradedEvent token_downgraded_events = 28;
  repeated TransferEvent transfer_events = 29;
  repeated ApprovalEvent approval_events = 30;
  repeated GovernanceReplacedEvent governance_replaced_events = 31;
  repeated AgreementClassRegisteredEvent agreement_class_registered_events = 32;
  repeated AgreementClassUpdatedEvent agreement_class_updated_events = 33;
  repeated SuperTokenFactoryUpdatedEvent super_token_factory_updated_events = 34;
  repeated SuperTokenLogicUpdatedEvent super_token_logic_updated_events = 35;
  repeated AppRegisteredEvent app_registered_events = 36;
  repeated JailEvent jail_events = 37;
  repeated RoleAdminChangedEvent role_admin_changed_events = 38;
  repeated RoleGrantedEvent role_granted_events = 39;
  repeated RoleRevokedEvent role_revoked_events = 40;
  repeated SetEvent set_events = 41;
  repeated ConfigChangedEvent config_changed_events = 42;
  repeated RewardAddressChangedEvent reward_address_changed_events = 43;
  repeated CFAv1LiquidationPeriodChangedEvent cfav1_liquidation_period_changed_events = 44;
  repeated PPPConfigurationChangedEvent pppconfiguration_changed_events = 45;
  repeated SuperTokenMinimumDepositChangedEvent super_token_minimum_deposit_changed_events = 46;
  repeated TrustedForwarderChangedEvent trusted_forwarder_changed_events = 47;
  repeated NewPICEvent new_pic_events = 48;
  repeated ExitRateChangedEvent exit_rate_changed_events = 49;
  repeated BondIncreasedEvent bond_increased_events = 50;
  repeated MemberUnitsUpdatedEvent member_units_updated_events = 51;
  repeated DistributionClaimedEvent distribution_claimed_events = 52;
}

message FlowUpdatedEvent {
  option (schema.table) = {
    name: "flow_updated_events"
    clickhouse_table_options: {
      order_by_fields: [{name: "id"}, {name: "block_number"}, {name: "log_index"}]
      partition_fields: [{name: "_block_timestamp_", function: toYYYYMM}]
    }
  };

  string id = 1 [(schema.field) = { primary_key: true }];
  uint64 block_number = 2;
  uint64 block_timestamp = 3;
  string transaction_hash = 4;
  uint32 log_index = 5;
  string contract = 6;
  string event_name = 7;
  string token = 8;
  string sender = 9;
  string receiver = 10;
  string flow_rate = 11;
  string total_sender_flow_rate = 12;
  string total_receiver_flow_rate = 13;
  string user_data = 14;
}

