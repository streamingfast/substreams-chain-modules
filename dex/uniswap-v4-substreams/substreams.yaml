specVersion: v0.1.0
package:
  name: uniswap-v4-substreams
  version: v0.1.1
  url: https://github.com/streamingfast/substreams-chain-modules/tree/main/dex/uniswap-v4-substreams
  description: >
    Uniswap v4 — event decode only (PoolManager + PositionManager) on every chain
    where v4 is deployed;
    Sinks well into Clickhouse (views included) and Postgres.

protobuf:
  files:
    - events.proto
  importPaths:
    - ./proto
  excludePaths:
    - google
    - sf/substreams

binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/uniswap_v4_substreams.wasm

network: mainnet

modules:
  - name: map_events
    kind: map
    initialBlock: 21688329
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:uniswap.v4.Events

params:
  map_events: pool_manager=0x000000000004444c5dc75cb358380d2e3de08a90&position_manager=0xbd216513d74c8cf14cf4747e6aaa6420ff64ee9e

