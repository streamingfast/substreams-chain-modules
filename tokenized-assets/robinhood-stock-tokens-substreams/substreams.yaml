specVersion: v0.1.0
package:
  name: robinhood-stock-tokens-substreams
  version: v0.4.0
  url: https://github.com/streamingfast/substreams-chain-modules/tree/main/tokenized-assets/robinhood-stock-tokens-substreams
  description: >
    Onchain basis for Robinhood Chain stock tokens: Uniswap V4 stock-token swaps
    (via uniswap-v4-robinhood by PaulieB14), Chainlink tokenized-equity reference
    prices, and the implied-vs-reference premium per trade, as substreams-sink-sql
    from-proto rows for ClickHouse. Built with Substreams Skills.

network: robinhood

imports:
  u4rh: https://spkg.io/PaulieB14/uniswap-v4-robinhood-v0.1.2.spkg

protobuf:
  files:
    - hood/basis/v1/basis.proto
    # Vendored from substreams-sink-sql; must be listed here so pack bundles
    # it (imports are resolved but not embedded), or the (schema.table) options
    # on basis.proto cannot be decoded by the sink or by `substreams info`.
    - sf/substreams/sink/sql/schema/v1/schema.proto
  importPaths:
    - ./proto
  # Rust codegen only. basis.proto imports the sink schema, so buf still
  # generates src/pb/schema.rs for it (--include-imports); that is expected.
  excludePaths:
    - sf/substreams
    - sf/ethereum
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/robinhood_stock_tokens_substreams.wasm

modules:
  - name: map_stock_swaps
    kind: map
    initialBlock: 9070
    doc: Stock-vs-quote (USDG/WETH/native) swaps as share trades, from u4rh:map_stock_events.
    inputs:
      - map: u4rh:map_stock_events
    output:
      type: proto:hood.basis.v1.StockSwaps

  - name: map_chainlink_answers
    kind: map
    initialBlock: 9070
    doc: AnswerUpdated rounds from the 35 Chainlink tokenized-equity aggregators.
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:hood.basis.v1.ChainlinkAnswers

  - name: store_ref_price
    kind: store
    initialBlock: 9070
    updatePolicy: set
    valueType: string
    doc: "ref:<ticker> -> <answer_usd>|<updated_at>|<block_ts>, last Chainlink round per ticker."
    inputs:
      - map: map_chainlink_answers

  - name: store_session_close
    kind: store
    initialBlock: 9070
    updatePolicy: set
    valueType: string
    doc: "close:<ticker> -> <price_usd>|<block_ts>, last usable swap (see StockSwap.usable) seen during a regular NYSE session."
    inputs:
      - map: map_stock_swaps

  - name: map_basis
    kind: map
    initialBlock: 9070
    doc: Implied price vs reference (Chainlink, else session close) per usable stock swap.
    inputs:
      - map: map_stock_swaps
      - store: store_ref_price
        mode: get
      - store: store_session_close
        mode: get
    output:
      type: proto:hood.basis.v1.BasisTicks

  - name: map_rows
    kind: map
    initialBlock: 9070
    doc: Sink module for `substreams-sink-sql from-proto`; stock_swaps, chainlink_answers and basis_ticks rows with id, block_time and ClickHouse-safe decimals.
    inputs:
      - map: map_stock_swaps
      - map: map_chainlink_answers
      - map: map_basis
    output:
      type: proto:hood.basis.v1.Rows
