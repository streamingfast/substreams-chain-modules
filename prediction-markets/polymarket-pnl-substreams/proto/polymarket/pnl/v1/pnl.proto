syntax = "proto3";

package polymarket.pnl.v1;

// Scope note: position/PnL/volume are derived from OrderFilled fills
// (streamingfast/polymarket-fills, unified v1+v2) plus CTF PositionSplit,
// PositionsMerge and PayoutRedemption (colindickson/polymarket-ctf).
// OrdersMatched is a redundant per-tx summary of OrderFilled legs already
// counted, so it is excluded to avoid double-counting.
//
// PnL uses a mark-to-market (cash-flow) model, not lot-level average cost:
// total_pnl(user, token) = cumulative_cash_flow + qty * latest_price. This
// is exact (no averaging assumption). No module here keeps state: the
// mappers emit per-block deltas and latest prices, Postgres accumulates them
// (add ops on user_positions / user_pnl, set on token_prices), and total_pnl
// is computed at query time by the user_positions_pnl view. It does mean
// realized and unrealized PnL aren't reported separately: that would need
// lot-level tracking, i.e. state a mapper does not have. Once qty reaches 0,
// total_pnl *is* the fully realized PnL, exactly.
//
// CTF token IDs are derived (src/ctf_position.rs) via Polymarket's own
// go-ctf-utils reference algorithm, for the top-level case only
// (parent_collection_id == 0) — the general (nested/combinatorial) case
// needs an elliptic-curve (BN254) collection-ID scheme this package does
// not implement, since it can't be verified without a live reference.
// Empirically, 0 of 89,328 sampled real split/merge events had a non-zero
// parent_collection_id, and go-ctf-utils itself has no support for one
// either, so this is not expected to matter in practice; any event that
// does have one is skipped, not guessed at.
message TradeRow {
  string id = 1; // "<tx_hash>-<log_index>-<leg>"
  uint64 block_number = 2;
  uint64 timestamp = 3;
  string tx_hash = 4;
  string user = 5;
  string counterparty = 6;
  string token_id = 7;
  string side = 8; // "buy" | "sell"
  string token_amount = 9;
  string collateral_amount = 10;
  string price = 11; // collateral_amount / token_amount, decimal string, "" if token_amount is 0
  uint32 exchange_version = 12;
  string exchange_address = 13;
}

message WhaleAlert {
  string id = 1;
  uint64 block_number = 2;
  uint64 timestamp = 3;
  string tx_hash = 4;
  string user = 5;
  string token_id = 6;
  string collateral_amount = 7;
}

message LatestPrice {
  string token_id = 1;
  string price = 2;
  uint64 block_number = 3;
  uint64 timestamp = 4;
}

message KeyedDelta {
  string key = 1;
  string delta = 2; // bigint decimal string, may be negative
}

// One leg of a fill: `key` holds "<user>:<token_id>". qty_delta > 0 means
// the user acquired qty_delta of token_id; < 0 means they disposed of
// -qty_delta. cash_delta is signed from the user's own wallet perspective:
// negative = collateral paid out, positive = collateral received.
message PositionLeg {
  string key = 1;
  string qty_delta = 2;
  string cash_delta = 3;
}

message TradeLegs {
  repeated PositionLeg legs = 1;
  // Also includes a "<user>:ALL" rollup entry per user touched this block,
  // summing cash_delta across every token for that user.
  repeated KeyedDelta cash_flow_deltas = 2;
  repeated KeyedDelta volume_deltas = 3; // key = "<user>"
  repeated KeyedDelta market_volume_deltas = 4; // key = "<token_id>"
  repeated LatestPrice price_updates = 5;
  repeated TradeRow trades = 6;
  repeated WhaleAlert whale_alerts = 7;
}

// keyed "<condition_id_hex>"; metadata only, see scope note above.
message MarketInfo {
  string condition_id = 1;
  string oracle = 2;
  string question_id = 3;
  uint32 outcome_slot_count = 4;
  bool resolved = 5;
  repeated string payout_numerators = 6;
  uint64 created_block = 7;
  uint64 resolved_block = 8;
}

message MarketDeltas {
  repeated MarketInfo created = 1;
  repeated MarketInfo resolved = 2;
}
