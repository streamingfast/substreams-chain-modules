# Local stack: ClickHouse (Substreams sink) + Hasura GraphQL on ClickHouse.
#
#   docker compose up -d
#   # after sink has tables + views:
#   python3 scripts/apply_views.py
#   # open Hasura Console → track api_* views (see README)
#
# Hasura Console:  http://localhost:8080  (admin secret: SecureMe!)
# ClickHouse HTTP: http://localhost:8123  (default / SecureMe!)
# GraphQL:         http://localhost:8080/v1/graphql
#
# ClickHouse support uses Hasura’s data connector (Enterprise-capable image).
# Set HASURA_GRAPHQL_EE_LICENSE_KEY if your build requires a license.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: superfluid-ch
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: SecureMe!
      CLICKHOUSE_DB: superfluid
    volumes:
      # Persist event tables across restarts / compose recreates
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Metadata DB for Hasura (not protocol data)
  postgres:
    image: postgres:15
    container_name: superfluid-hasura-pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_USER: postgres
      POSTGRES_DB: hasura
    volumes:
      - hasura_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: superfluid-hasura-redis
    restart: unless-stopped

  # ClickHouse GraphQL data connector agent (Hasura v2)
  data-connector-agent:
    image: hasura/clickhouse-data-connector:v2.49.5
    container_name: superfluid-ch-connector
    restart: unless-stopped
    # Host port optional (debug). Engine talks to agent on the Docker network.
    ports:
      - "9100:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  hasura:
    image: hasura/graphql-engine:v2.49.5
    container_name: superfluid-hasura
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Uncomment and set if required by your Hasura edition:
      # HASURA_GRAPHQL_EE_LICENSE_KEY: "${HASURA_GRAPHQL_EE_LICENSE_KEY:-}"
      HASURA_GRAPHQL_ADMIN_SECRET: "${HASURA_GRAPHQL_ADMIN_SECRET:-SecureMe!}"
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/hasura
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      # Serve console JS from the image (not CDN). Avoids Safari/WebKit error:
      #   TypeError: '' is not a valid JavaScript MIME type
      # when the browser ES-imports CDN assetLoader.js.gz.
      HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_REDIS_URL: redis://redis:6379
      HASURA_GRAPHQL_RATE_LIMIT_REDIS_URL: redis://redis:6379
      HASURA_GRAPHQL_MAX_CACHE_SIZE: "200"
      # Pre-register ClickHouse data connector agent as backend "clickhouse"
      HASURA_GRAPHQL_METADATA_DEFAULTS: >-
        {"backend_configs":{"dataconnector":{"clickhouse":{"uri":"http://data-connector-agent:8080"}}}}
      # Connection details used by scripts/hasura_connect_clickhouse.py
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: SecureMe!
      CLICKHOUSE_DATABASE: superfluid
    depends_on:
      postgres:
        condition: service_healthy
      data-connector-agent:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  hasura_pg_data:
  # Pre-created as superfluid_ch_data when migrating an existing container, or
  # leave unnamed project volume. Override with:
  #   docker volume create superfluid_ch_data
  #   and external: true below if reusing that name.
  ch_data:
    name: superfluid_ch_data
    external: true
