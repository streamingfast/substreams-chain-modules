syntax = "proto3";
package hood.basis.v1;

import "google/protobuf/timestamp.proto";
import "sf/substreams/sink/sql/schema/v1/schema.proto";

// Root of map_rows, the module substreams-sink-sql consumes in from-proto
// mode. Only messages carrying (schema.table) become tables, so anything
// reachable from Rows that is annotated is sunk. Rows itself is never a table.
message Rows {
  repeated StockSwap stock_swaps = 1;
  repeated ChainlinkAnswer chainlink_answers = 2;
  repeated BasisTick basis_ticks = 3;
}

// One row per Uniswap V4 swap on Robinhood Chain where exactly one leg is a
// registry stock token and the other is USDG, WETH or native. Derived from
// uniswap-v4-robinhood's map_stock_events; amounts are already decimal-adjusted
// there, this only re-frames them as a trade in shares against a quote.
message StockSwaps {
  repeated StockSwap swaps = 1;
  // Pools map_stock_events emitted that this module deliberately drops.
  uint32 skipped_stock_stock = 2;
  uint32 skipped_other = 3;
}

// Decimal string fields hold "" when unknown in map_stock_swaps; map_rows
// rewrites them to "0" (see priced / shares_known) and fills id / block_time.
message StockSwap {
  option (schema.table) = {
    name: "stock_swaps"
    clickhouse_table_options: {
      order_by_fields: [{name: "ticker"}, {name: "block_time"}, {name: "id"}]
    }
  };

  string id         = 20; // "<tx_hash>-<log_index>"
  uint64 block_num  = 1;
  uint64 block_ts   = 2;   // unix seconds
  google.protobuf.Timestamp block_time = 21;
  string tx_hash    = 3;
  uint32 log_index  = 4;
  string pool_id    = 5;
  string ticker     = 6;   // registry ticker of the stock leg
  string token      = 7;   // stock token address, 0x lowercase
  string side       = 8;   // "buy" = trader received stock, else "sell"
  string shares_ui  = 9 [(schema.field) = { convertTo: { decimal128 { scale: 18 } } }];   // |amountN_ui|, ERC-8056 share count
  string shares_raw_adjusted = 10 [(schema.field) = { convertTo: { decimal128 { scale: 18 } } }]; // |amountN_adjusted|, raw token units / 10^18
  string quote_symbol = 11;
  string quote_kind   = 12; // "usdg" | "weth" | "native"
  string quote_amount = 13 [(schema.field) = { convertTo: { decimal128 { scale: 18 } } }]; // |quote leg adjusted|
  string amount_usd   = 14 [(schema.field) = { convertTo: { decimal128 { scale: 18 } } }];
  string price_usd    = 15 [(schema.field) = { convertTo: { decimal128 { scale: 18 } } }]; // amount_usd / shares_ui
  bool   priced       = 22; // upstream valued the swap: amount_usd is real. price_usd also needs shares_known.
  bool   shares_known = 23; // false when shares_ui was not populated upstream
  bool   usable       = 24; // priced, shares_known, and notional / price inside the quality floors; only these feed store_session_close and basis_ticks
  string sender       = 16;
  string origin       = 17;
  uint32 fee          = 18; // fee actually charged (hook may override)
  string hook_address = 19;
}

// Chainlink AnswerUpdated rounds from the tokenized-equity aggregators.
message ChainlinkAnswers {
  repeated ChainlinkAnswer answers = 1;
}

message ChainlinkAnswer {
  option (schema.table) = {
    name: "chainlink_answers"
    clickhouse_table_options: {
      order_by_fields: [{name: "ticker"}, {name: "block_time"}, {name: "id"}]
    }
  };

  string id         = 11; // "<tx_hash>-<log_index>"
  uint64 block_num  = 1;
  uint64 block_ts   = 2;
  google.protobuf.Timestamp block_time = 12;
  string tx_hash    = 3;
  uint32 log_index  = 4;
  string ticker     = 5;
  string feed       = 6;   // proxy address
  string aggregator = 7;   // emitting aggregator address
  string answer_usd = 8 [(schema.field) = { convertTo: { decimal128 { scale: 18 } } }]; // int256 answer scaled by 8 decimals
  string round_id   = 9;
  uint64 updated_at = 10;
}

// Onchain implied price vs reference, one per usable stock swap.
message BasisTicks {
  repeated BasisTick ticks = 1;
}

message BasisTick {
  option (schema.table) = {
    name: "basis_ticks"
    clickhouse_table_options: {
      order_by_fields: [{name: "ticker"}, {name: "block_time"}, {name: "id"}]
    }
  };

  string id          = 14; // "<tx_hash>-<log_index>" of the swap
  uint64 block_num   = 1;
  uint64 block_ts    = 2;
  google.protobuf.Timestamp block_time = 15;
  string tx_hash     = 3;
  uint32 log_index   = 4;
  string ticker      = 5;
  string implied_usd = 6 [(schema.field) = { convertTo: { decimal128 { scale: 18 } } }];  // = StockSwap.price_usd
  string ref_usd     = 7 [(schema.field) = { convertTo: { decimal128 { scale: 18 } } }];  // 0 when ref_source is "none"
  string ref_source  = 8;  // "chainlink" | "session_close" | "none"
  uint64 ref_ts      = 9;  // feed updated_at, or block_ts of the session close
  int64  premium_bps = 10; // (implied / ref - 1) * 10000, truncated; 0 when no ref
  string session     = 11; // "regular" | "extended" | "closed" (NYSE, America/New_York)
  string amount_usd  = 12 [(schema.field) = { convertTo: { decimal128 { scale: 18 } } }];
  string side        = 13;
}
